# 夹爪测试配置文件
# 用于 StTestGripper 状态，运行时可直接修改目标位置而无需重新编译

test_gripper:
  # 兼容旧单步配置；如果配置了 steps，则按步骤顺序测试两个夹爪的开关
  mode: "torque"
  
  # 目标位置 (当 mode=position 时使用)
  # 范围通常为 0.0 (关闭) 到 1.0 (打开)
  position: 0.5
  
  # 预设值 (当 mode=preset 时使用)
  preset: 0

  # 扭矩模式下使用，远端 piper 夹爪驱动支持 "open" / "close"
  command: "open"
  torque: 1.0
  
  # 兼容旧单步配置
  left_valid: true
  right_valid: false

  # 闭环测试：远端收到真实夹爪反馈后 left_valid/right_valid 才会为 true
  wait_for_feedback: true

  feedback_topic: "/joint_states_double_arm"
  position_tolerance: 0.03
  
  # 夹爪控制话题
  topic: "/end_effector_cmd_lr"
  
  # 可选：在执行命令前的延迟时间（秒）
  delay_before_sec: 0.0
  
  # 可选：命令执行的超时时间（秒）
  timeout_sec: 5.0

  # 每一步最少保持多久，避免刚收到反馈就切下一步，看起来像抽搐
  step_hold_sec: 1.5
  
  # 日志级别
  log_level: "INFO"

  # 默认顺序：左开、左关、右开、右关
  steps:
    - name: "left_open"
      mode: "torque"
      command: "open"
      torque: 1.0
      left_valid: true
      right_valid: false
      min_duration_sec: 1.5
      timeout_sec: 5.0

    - name: "left_close"
      mode: "torque"
      command: "close"
      torque: 1.0
      left_valid: true
      right_valid: false
      min_duration_sec: 1.5
      timeout_sec: 5.0

    - name: "right_open"
      mode: "torque"
      command: "open"
      torque: 1.0
      left_valid: false
      right_valid: true
      min_duration_sec: 1.5
      timeout_sec: 5.0

    - name: "right_close"
      mode: "torque"
      command: "close"
      torque: 1.0
      left_valid: false
      right_valid: true
      min_duration_sec: 1.5
      timeout_sec: 5.0

